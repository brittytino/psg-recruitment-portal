# Production deployment. Manually triggered, restricted to main, and gated by the protected
# "production" GitHub environment (required reviewers). CI must have passed for the commit.
# NOT YET EXECUTED: requires a VPS and the secrets listed in docs/deployment/vps-deployment.md.
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Build and push immutable image
        run: |
          TAG=${GITHUB_SHA::12}
          IMAGE=ghcr.io/${{ github.repository }}/app:$TAG
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build --target runtime --build-arg GIT_SHA=$TAG -t $IMAGE .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
      - name: Blue-green deploy on the VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 600 /dev/null key && echo "$SSH_KEY" > key
          echo "$KNOWN_HOSTS" > known_hosts
          ssh -i key -o UserKnownHostsFile=known_hosts "$SSH_USER@$SSH_HOST" \
            "cd /opt/srportal && git fetch --quiet && git checkout --quiet ${GITHUB_SHA} && ./infrastructure/blue-green/deploy.sh $IMAGE $TAG"
