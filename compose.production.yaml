# Production (VPS) / local blue-green simulation stack.
# Never edit image tags by hand: infrastructure/blue-green/deploy.sh manages BLUE_IMAGE / GREEN_IMAGE
# via infrastructure/blue-green/state/images.env. Only Nginx publishes ports.
#
#   docker compose -p srportal-prod -f compose.production.yaml --env-file .env.production \
#     --env-file infrastructure/blue-green/state/images.env up -d
name: srportal-prod

x-app: &app
  restart: unless-stopped
  environment: &app-env
    NODE_ENV: production
    APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN}
    DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    REDIS_URL: redis://redis:6379
    SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
    COOKIE_SECURE: ${COOKIE_SECURE:-true}
    SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
    STORAGE_DIR: /var/lib/srportal/storage
    MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    CONVERTER_URL: http://converter:3100
    CONVERTER_TOKEN: ${CONVERTER_TOKEN:?set CONVERTER_TOKEN}
    MALWARE_SCAN: clamav
    CLAMAV_HOST: clamav
    CLAMAV_PORT: 3310
    EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
    SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_SECURE: ${SMTP_SECURE:-false}
    SMTP_USER: ${SMTP_USER:?set SMTP_USER}
    SMTP_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD}
    SMTP_FROM_NAME: ${SMTP_FROM_NAME:-PSG College of Technology Recruitment}
    SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-recruitments@psgtech.ac.in}
    MAIL_FROM: ${MAIL_FROM:-PSG College of Technology Recruitment <recruitments@psgtech.ac.in>}
    SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-10000}
    SMTP_GREETING_TIMEOUT_MS: ${SMTP_GREETING_TIMEOUT_MS:-10000}
    SMTP_SOCKET_TIMEOUT_MS: ${SMTP_SOCKET_TIMEOUT_MS:-20000}
    OTP_LENGTH: ${OTP_LENGTH:-6}
    OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES:-5}
    OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
    OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
    OTP_MAX_SENDS_PER_HOUR: ${OTP_MAX_SENDS_PER_HOUR:-5}
    LOG_LEVEL: ${LOG_LEVEL:-info}
  volumes:
    - storage:/var/lib/srportal/storage
  networks: [data, backend, edge]
  stop_grace_period: 20s
  deploy:
    resources:
      limits: { memory: 768m }
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  nginx:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./infrastructure/blue-green/state/upstream:/etc/nginx/upstream:ro
    networks: [edge]
    logging: *logging

  app-blue:
    <<: *app
    image: ${BLUE_IMAGE:-psg-srp-app:none}
    environment:
      <<: *app-env
      ROLE: web-blue
      GIT_SHA: ${BLUE_VERSION:-unknown}

  app-green:
    <<: *app
    image: ${GREEN_IMAGE:-psg-srp-app:none}
    environment:
      <<: *app-env
      ROLE: web-green
      GIT_SHA: ${GREEN_VERSION:-unknown}

  worker:
    <<: *app
    image: ${WORKER_IMAGE:-psg-srp-app:none}
    command: ["npm", "run", "worker:prod"]
    environment:
      <<: *app-env
      ROLE: worker
      GIT_SHA: ${WORKER_VERSION:-unknown}
    networks: [data, backend]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('fs').statSync('/tmp/worker-alive').mtimeMs > Date.now() - 60000 || process.exit(1)",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Graceful drain: in-flight jobs finish before the old worker exits.
    stop_grace_period: 120s

  # Expand-only migrations, run explicitly by deploy.sh with the new image (owner role).
  migrate:
    image: ${MIGRATE_IMAGE:-psg-srp-app:none}
    profiles: ["ops"]
    command: ["sh", "-c", "npx prisma migrate deploy && node build-worker/seed.js"]
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?set MIGRATION_DATABASE_URL}
    networks: [data]

  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-srportal}
      POSTGRES_USER: ${POSTGRES_USER:-srp_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:-srp_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    networks: [data]
    stop_grace_period: 60s
    logging: *logging

  redis:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }
    networks: [data]
    logging: *logging

  converter:
    image: ${CONVERTER_IMAGE:-psg-srp-converter:local}
    restart: unless-stopped
    environment: { CONVERTER_TOKEN: "${CONVERTER_TOKEN}", CONVERTER_CONCURRENCY: 2 }
    read_only: true
    tmpfs: ["/tmp:size=512m"]
    networks: [backend]
    deploy: { resources: { limits: { memory: 1g } } }
    logging: *logging

  clamav:
    image: clamav/clamav:1.4.3
    restart: unless-stopped
    volumes: [clamdb:/var/lib/clamav]
    healthcheck: { test: ["CMD", "clamdcheck.sh"], interval: 30s, retries: 20, start_period: 300s }
    networks: [backend]
    deploy: { resources: { limits: { memory: 2g } } }
    logging: *logging

  # Modern Visual Database Management Tool (pgweb)
  db-viewer:
    image: sosedoff/pgweb:0.16.1
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-srp_owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-srportal}?sslmode=disable
      PGWEB_AUTH_USER: ${DB_VIEWER_USER:-psgadmin}
      PGWEB_AUTH_PASS: ${DB_VIEWER_PASSWORD:-PsgTech@2026!}
    ports:
      - "${DB_VIEWER_HOST_PORT:-6981}:8081"
    depends_on:
      db: { condition: service_healthy }
    networks: [data, edge]
    logging: *logging

networks:
  data: { internal: true }
  backend: {}
  edge: {}

volumes:
  pgdata:
  redisdata:
  storage:
  clamdb:
