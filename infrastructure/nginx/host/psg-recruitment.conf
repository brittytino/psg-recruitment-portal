# Host Nginx for the single-server production setup (./prod.sh).
# Installed by infrastructure/nginx/host/setup-nginx.sh, which replaces the two domain placeholders:
#   __APP_DOMAIN__  e.g. recruitments.psgtech.ac.in      -> portal  (127.0.0.1:6969)
#   __DB_DOMAIN__   e.g. db.recruitments.psgtech.ac.in   -> pgweb   (127.0.0.1:6981, read-only)
# Certificates come from Let's Encrypt (certbot --nginx).

# Campus users share one public IP (NAT): limits are per IP, so they are sized for many people.
limit_req_zone $binary_remote_addr zone=psg_auth:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=psg_general:10m rate=100r/s;

map $http_upgrade $psg_connection_upgrade {
    default upgrade;
    ""      close;
}

# ---------------------------------------------------------------- Recruitment portal
server {
    listen 80;
    listen [::]:80;
    server_name __APP_DOMAIN__;
    limit_req_status 429;
    server_tokens off;
    client_max_body_size 25m;
    client_body_timeout 300s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # X-Frame-Options comes from the app (DENY everywhere, SAMEORIGIN for the in-page PDF preview).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Readiness details stay internal; liveness is public for uptime monitors.
    location = /healthz/ready { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:6969; }
    location = /healthz/smtp  { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:6969; }

    location ~ ^/(login|login/verify|register|verify-email)$ {
        limit_req zone=psg_auth burst=100 nodelay;
        proxy_pass http://127.0.0.1:6969;
        include /etc/nginx/snippets/psg-proxy.conf;
    }

    location / {
        limit_req zone=psg_general burst=300 nodelay;
        proxy_pass http://127.0.0.1:6969;
        include /etc/nginx/snippets/psg-proxy.conf;
    }
}

# ---------------------------------------------------------------- Database viewer (pgweb)
server {
    listen 80;
    listen [::]:80;
    server_name __DB_DOMAIN__;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Optional: restrict to the campus network / admin IPs (recommended). Example:
    #   allow 14.139.0.0/16;
    #   deny all;
    include /etc/nginx/snippets/psg-db-allow.conf;

    location / {
        limit_req zone=psg_general burst=40 nodelay;
        proxy_pass http://127.0.0.1:6981;
        include /etc/nginx/snippets/psg-proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $psg_connection_upgrade;
    }
}
