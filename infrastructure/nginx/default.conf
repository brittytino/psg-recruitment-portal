# Reverse proxy and blue-green traffic router.
# The active upstream is defined in /etc/nginx/upstream/active.conf, written by
# infrastructure/blue-green/switch.sh (validated with `nginx -t` before every reload).
include /etc/nginx/upstream/active.conf;

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;   # effective only behind HTTPS

    # Internal diagnostics are never exposed publicly.
    location = /healthz/ready { allow 127.0.0.1; deny all; proxy_pass http://app_active; }
    location = /healthz/live  { proxy_pass http://app_active; }

    location ~ ^/(login|register|forgot-password|reset-password)$ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://app_active;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://app_active;
        include /etc/nginx/proxy_params.conf;
    }
}
