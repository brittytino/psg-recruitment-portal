# Development overrides: publish data services on non-default host ports (loopback only) so that
# tests, Prisma Studio and scripts can run from the host. Never use this file in production.
services:
  app:
    environment:
      # Development always works offline: every e-mail (including sign-in codes) goes to the local
      # Mailpit inbox at http://localhost:8025, and the code is also printed in the app log.
      # Set DEV_EMAIL_PROVIDER=smtp in .env to test real delivery from a network that allows SMTP.
      NODE_ENV: development
      APP_ORIGIN: ${DEV_APP_ORIGIN:-http://localhost:6969}
      COOKIE_SECURE: "false"
      EMAIL_PROVIDER: ${DEV_EMAIL_PROVIDER:-mailpit}
      SMTP_HOST: ${DEV_SMTP_HOST:-mailpit}
      SMTP_PORT: ${DEV_SMTP_PORT:-1025}
      SMTP_SECURE: ${DEV_SMTP_SECURE:-false}
      DEV_LOG_OTP: "true"
  worker:
    environment:
      # Development always works offline: every e-mail (including sign-in codes) goes to the local
      # Mailpit inbox at http://localhost:8025, and the code is also printed in the app log.
      # Set DEV_EMAIL_PROVIDER=smtp in .env to test real delivery from a network that allows SMTP.
      NODE_ENV: development
      APP_ORIGIN: ${DEV_APP_ORIGIN:-http://localhost:6969}
      COOKIE_SECURE: "false"
      EMAIL_PROVIDER: ${DEV_EMAIL_PROVIDER:-mailpit}
      SMTP_HOST: ${DEV_SMTP_HOST:-mailpit}
      SMTP_PORT: ${DEV_SMTP_PORT:-1025}
      SMTP_SECURE: ${DEV_SMTP_SECURE:-false}
      DEV_LOG_OTP: "true"
  db:
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-6543}:5432"]
    networks: [data, devhost]
  redis:
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-63879}:6379"]
    networks: [data, devhost]
  converter:
    ports: ["127.0.0.1:${CONVERTER_HOST_PORT:-63100}:3100"]
  clamav:
    ports: ["127.0.0.1:63310:3310"]
  mailpit:
    image: axllent/mailpit:v1.27.10
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-2525}:1025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8025/api/v1/info || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend, frontend]

  # Modern Visual Database Management Tool (pgweb) accessible at http://localhost:6981
  db-viewer:
    profiles: !reset []
    command: !reset []
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-srp_owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-srportal}?sslmode=disable
      PGWEB_AUTH_USER: ${DB_VIEWER_USER:-}
      PGWEB_AUTH_PASS: ${DB_VIEWER_PASSWORD:-}
    ports:
      - "127.0.0.1:${DB_VIEWER_HOST_PORT:-6981}:8081"
    depends_on:
      db: { condition: service_healthy }
    networks: [data, frontend, devhost]

networks:
  # Ports cannot be published from an internal-only network, so the data services join an
  # additional bridge network in development only.
  devhost: {}
