# PSG Staff Recruitment Portal — local stack.
#   docker compose up -d --build            # full stack on http://localhost:${APP_HOST_PORT:-6969}
#   docker compose -f compose.yaml -f compose.dev.yaml up -d   # + DB/Redis/Mailpit/converter host ports
# Production uses compose.production.yaml (blue-green). See docs/deployment/.
name: psg-srportal

x-app-env: &app-env
  NODE_ENV: production
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:6969}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  SESSION_SECRET: ${SESSION_SECRET}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
  STORAGE_DIR: /var/lib/srportal/storage
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
  CONVERTER_URL: http://converter:3100
  CONVERTER_TOKEN: ${CONVERTER_TOKEN}
  MALWARE_SCAN: ${MALWARE_SCAN:-clamav}
  CLAMAV_HOST: clamav
  CLAMAV_PORT: 3310
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mailpit}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-PSG College of Technology Recruitment}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-recruitments@psgtech.ac.in}
  MAIL_FROM: ${MAIL_FROM:-PSG College of Technology Recruitment <recruitments@psgtech.ac.in>}
  SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-10000}
  SMTP_GREETING_TIMEOUT_MS: ${SMTP_GREETING_TIMEOUT_MS:-10000}
  SMTP_SOCKET_TIMEOUT_MS: ${SMTP_SOCKET_TIMEOUT_MS:-20000}
  OTP_LENGTH: ${OTP_LENGTH:-6}
  OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES:-5}
  OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
  OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
  OTP_MAX_SENDS_PER_HOUR: ${OTP_MAX_SENDS_PER_HOUR:-5}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-srportal}
      POSTGRES_USER: ${POSTGRES_USER:-srp_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:-srp_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]
    stop_grace_period: 30s

  redis:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    # AOF persistence so queued jobs survive restarts; noeviction is required by BullMQ.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  converter:
    build:
      context: .
      dockerfile: infrastructure/docker/converter.Dockerfile
    image: psg-srp-converter:local
    restart: unless-stopped
    environment:
      CONVERTER_TOKEN: ${CONVERTER_TOKEN}
      CONVERTER_CONCURRENCY: 2
    read_only: true
    tmpfs: ["/tmp:size=512m"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [backend]
    deploy:
      resources:
        limits: { memory: 1g, cpus: "1.5" }

  clamav:
    image: clamav/clamav:1.4.3
    restart: unless-stopped
    volumes:
      - clamdb:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    networks: [backend]
    deploy:
      resources:
        limits: { memory: 2g }

  mailpit:
    image: axllent/mailpit:v1.27.10
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_HOST_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8025/api/v1/info || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend, frontend]

  # Visual database management tool (Adminer) accessible at http://localhost:6981
  adminer:
    image: adminer:5.3.0
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha-dark
    ports:
      - "${ADMINER_HOST_PORT:-6981}:8080"
    networks: [data, frontend]
    depends_on:
      db: { condition: service_healthy }

  # One-shot migration runner (owner role). App and worker start only after it succeeds.
  migrate:
    build: { context: ., target: runtime }
    image: psg-srp-app:${IMAGE_TAG:-local}
    # Apply migrations, then register the official form templates (idempotent, checksum-verified).
    command: ["sh", "-c", "npx prisma migrate deploy && node build-worker/seed.js"]
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL}
    depends_on:
      db: { condition: service_healthy }
    networks: [data]
    restart: "no"

  app:
    build: { context: ., target: runtime }
    image: psg-srp-app:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *app-env
      ROLE: web
    ports:
      - "${APP_HOST_PORT:-6969}:3000"
    volumes:
      - storage:/var/lib/srportal/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks: [data, backend, frontend]
    stop_grace_period: 20s
    deploy:
      resources:
        limits: { memory: 768m }

  worker:
    build: { context: ., target: runtime }
    image: psg-srp-app:${IMAGE_TAG:-local}
    restart: unless-stopped
    command: ["npm", "run", "worker:prod"]
    environment:
      <<: *app-env
      ROLE: worker
    volumes:
      - storage:/var/lib/srportal/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      converter: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('fs').statSync('/tmp/worker-alive').mtimeMs > Date.now() - 60000 || process.exit(1)",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [data, backend]
    stop_grace_period: 60s
    deploy:
      resources:
        limits: { memory: 768m }

networks:
  # PostgreSQL and Redis: internal network with no external route.
  data:
    internal: true
  # Internal services (converter, ClamAV, Mailpit). ClamAV needs egress to update signatures.
  backend: {}
  frontend: {}

volumes:
  pgdata:
  redisdata:
  storage:
  clamdb:
